name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · e2e
    runs-on: ubuntu-latest

    # The integration suites talk to a real Postgres — there is no
    # testcontainers setup, and lib/test/setup.ts only loads dotenv. The
    # exclusion constraint in migration 0001 needs btree_gist, which the
    # official image ships and its superuser can create.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rezerve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rezerve_test
      # Better Auth reads this with plain process.env, but a real value keeps
      # it from falling back to anything surprising. Not a secret: this
      # database exists for the length of one job.
      BETTER_AUTH_SECRET: ci-not-a-secret-ci-not-a-secret-32
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version used locally, so CI and dev resolve the same.
          bun-version: 1.3.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run check

      # vitest.config.ts sets fileParallelism: false — the suites share one
      # Postgres and each opens its own pool.
      - name: Test
        run: bun run test

      # Output tracing decides which node_modules files a deployed function
      # receives, and nothing above can see it: locally node_modules is always
      # complete. The iyzico SDK loads its resources in a way tracing cannot
      # follow, and when that broke, every payment failed in production.
      - name: Build
        run: bun run build

      - name: Check the payment SDK survives tracing
        run: bun run check:trace

      # The end-to-end suite drives that same build in Chromium, against this
      # job's Postgres seeded with the two demo businesses. Without a
      # submerchant key the Pro demo cannot collect kapora, so bookings run on
      # the free demo; with no SMTP server, no email leaves the job.
      - name: Seed the demo businesses
        run: bun run seed:demo

      - name: Cache Playwright's browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end
        run: bun run e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
